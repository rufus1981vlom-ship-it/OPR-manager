debug:
  enabled: false

ai:
  provider: "github-models" # github-models | openai | deepseek
  github-models:
    enabled: true
    endpoint: "https://models.github.ai/inference/chat/completions"
    token: ""
    model: "openai/gpt-4.1"
    api-version: "2022-11-28"
    timeout-ms: 60000
    retries: 2

  # legacy fallback block for openai/deepseek mode
  base-url: "https://api.openai.com/v1"
  api-key: ""
  model: "gpt-5-mini"

vk-account:
  token: ""
  api-version: "5.199"

server:
  ip: "play.example.net"
  vk-link: "https://vk.com/example"

server-profile:
  name: "PROrda"
  ip: "play.example.net"
  vk-link: "https://vk.com/example"
  version: "1.20.4"
  genre: "factions"
  subgenre: "pvp-survival"
  features:
    - "клановые войны"
    - "ивенты"
    - "активная администрация"
  staff-recruitment:
    roles:
      - "администратор"
      - "хэлпер"

smm:
  enabled: true
  main-group-id: 123456789
  interval-hours: 8
  rubrics:
    - "interesting"
    - "facts"
    - "minecraft-facts"
    - "anecdotes"
    - "jokes-light"
    - "meme-light"
    - "server-life"
    - "nostalgia"
    - "survival-story"
    - "atmosphere"
    - "question-post"
    - "polls"
    - "today-on-server"
    - "evening-online"
    - "mini-story"
    - "myth-vs-fact"
    - "did-you-know"
    - "community-post"
    - "recruitment-soft"

pr:
  enabled: true
  cycle-minutes: 60
  dispatch-window-minutes: 30
  jitter-seconds: 20
  rubrics:
    - "advertising-direct"
    - "join-call"
    - "clan-war"
    - "factions-promo"
    - "pvp-promo"
    - "anarchy-promo"
    - "old-factions-vibe"
    - "today-join"
    - "evening-join"
    - "recruit-staff"
    - "admin-search"
    - "helper-search"
    - "challenge-call"
    - "comeback-call"
    - "why-us"
    - "online-now"

validation:
  min-length: 80
  max-length: 900
  retries: 2

polls:
  enabled: true

anti-repeat:
  recent-limit: 30
